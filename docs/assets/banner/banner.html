<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ghosted — banner</title>
<style>
  /* The app's own typeface, straight out of the repo. */
  @font-face {
    font-family: "Geist";
    src: url("../../../app/fonts/GeistVF.woff") format("woff");
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }

  /* Two canvases, one design: the README strip is wider and shorter than the
     social card, so only the numbers change between them. */
  .canvas {
    position: relative;
    overflow: hidden;
    font-family: "Geist", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(168deg, #7c3aed 0%, #6d28d9 58%, #5b21b6 100%);
    isolation: isolate;
  }
  .canvas.header { width: 1600px; height: 640px; }
  .canvas.social { width: 1200px; height: 630px; }

  /* The field's texture: the same mascot, very faint, at the landing's angles. */
  .ghost {
    position: absolute;
    opacity: 0.08;
    user-select: none;
  }
  .ghost svg { display: block; width: 100%; height: auto; }

  .content {
    position: absolute;
    inset: 0;
    display: grid;
    align-items: center;
    padding-left: 86px;
    grid-template-columns: minmax(0, 1fr) 600px;
    gap: 24px;
    /* Symmetric gutters: the pile used to sit flush against the right edge. */
    padding-right: 86px;
  }
  .social .content { grid-template-columns: minmax(0, 1fr) 520px; padding-left: 56px; padding-right: 56px; }
  .social .pile { transform: translateY(-50%) scale(0.93); }

  /* --- left: what it is --------------------------------------------------- */
  h1 {
    font-size: 52px;
    font-weight: 600;
    line-height: 1.08;
    letter-spacing: -0.035em;
    max-width: 790px;
    text-wrap: balance;
  }
  .social h1 { font-size: 48px; max-width: 560px; }

  /* The landing's hero subhead, verbatim: the card and the page say one thing. */
  .lede {
    margin-top: 22px;
    max-width: 620px;
    font-size: 21px;
    font-weight: 400;
    line-height: 1.45;
    letter-spacing: -0.012em;
    color: rgba(255, 255, 255, 0.82);
  }
  .social .lede { margin-top: 18px; max-width: 560px; font-size: 18px; }

  .meta {
    margin-top: 30px;
    display: flex; align-items: center; gap: 14px;
    font-size: 19px; font-weight: 450; letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.7);
  }
  .social .meta { margin-top: 24px; font-size: 16px; }
  .meta i { width: 5px; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.45); }

  /* --- right: the pile, centred in its half ------------------------------- */
  .stage { position: relative; height: 100%; }
  .pile {
    position: absolute;
    top: 50%; right: 0;
    transform: translateY(-50%);
    transform-origin: right center;
    width: 560px; height: 474px;
  }

  .card {
    position: absolute;
    border-radius: 18px;
    box-shadow: 0 40px 70px -30px rgba(20, 4, 55, 0.75), 0 12px 30px -18px rgba(20, 4, 55, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.16);
  }
  /* The cards lean against each other; the ghosts stand in front of them. */
  .card.ghosted { width: 384px; left: 125px; top: 50px; transform: rotate(2.6deg); }
  .card.offer   { width: 404px; left: 0;    top: 222px; transform: rotate(-3.2deg); }

  .mascot { position: absolute; z-index: 2; }
  .mascot.happy       { width: 200px; left: -55px; top: 95px; transform: rotate(-7deg); }
  .mascot.finger-guns { width: 200px; right: 16px;  top: 260px; transform: rotate(7deg);}
</style>
</head>
<body>
  <div class="canvas" id="canvas">
    <!-- texture -->
    <!-- <div class="ghost" style="width: 190px; left: -34px; top: -46px; transform: rotate(-16deg);"><img src="../../../public/staring-at-phone-sad.svg" width="190" /></div>
    <div class="ghost" style="width: 132px; left: 640px; bottom: -40px; transform: rotate(12deg);"><img src="../../../public/confused.svg" width="132" /></div>
    <div class="ghost" style="width: 118px; right: 96px; top: 22px; transform: rotate(-9deg);"><img src="../../../public/content.svg" width="118" /></div> -->

    <div class="content">
      <div>
        <h1>Ghosted, a free, <span style="white-space: nowrap">open-source</span> job tracker</h1>
        <p class="lede">
          Never let a job application go quiet on you. Every application,
          interview and ghosting on one timeline, and a section of its own for
          the ones that stopped answering.
        </p>
        <div class="meta">
          <span>Self-hosted in one command</span><i></i>
          <span>MIT</span><i></i>
          <span>ghosted.boo</span>
        </div>
      </div>

      <div class="stage">
        <div class="pile">
          <img class="card ghosted" src="./card-ghosted.png" alt="" />
          <img class="card offer" src="./card-offer.png" alt="" />
          <img class="mascot happy" src="../../../public/staring-at-phone-happy.svg" alt="" />
          <img class="mascot finger-guns" src="../../../public/finger-guns.svg" alt="" />
        </div>
      </div>
    </div>
  </div>
  <script>
    // ?size=header|social picks the canvas, so one file renders both.
    const size = new URLSearchParams(location.search).get("size") || "header";
    document.getElementById("canvas").classList.add(size);
  </script>
</body>
</html>
